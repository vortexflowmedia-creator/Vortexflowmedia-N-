<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Card 02</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070d;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif}
.card{width:1440px;height:1440px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:linear-gradient(145deg,#0b0b14,#0f0f1a);border:1px solid rgba(255,255,255,0.06);padding:60px}
.card::before{content:'';position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.1),transparent 70%);top:-20%;right:-15%;pointer-events:none}
.card::after{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.06),transparent 70%);bottom:-15%;left:-12%;pointer-events:none}
.badge{font-size:22px;letter-spacing:6px;text-transform:uppercase;color:#55556a;font-weight:600;background:rgba(255,255,255,0.04);padding:12px 36px;border-radius:100px;border:1px solid rgba(255,255,255,0.06);z-index:1;align-self:center }
.service-number{font-family:'Bebas Neue',sans-serif;font-size:160px;line-height:1;background:linear-gradient(135deg,#7c3aed,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0.1;position:absolute;top:60px;left:60px;z-index:0;letter-spacing:8px}
.service-name{font-family:'Playfair Display',serif;font-size:100px;font-weight:700;color:#f0f0f5;text-align:center;line-height:1.1;z-index:1;letter-spacing:-1px;margin:0 40px }
.service-desc{font-size:28px;color:#8888a0;text-align:center;max-width:900px;z-index:1;line-height:1.4;margin:0 40px}
.price-box{display:flex;align-items:baseline;justify-content:center;gap:16px;z-index:1}
.price{font-family:'Playfair Display',serif;font-weight:700;font-size:160px;line-height:1.2;background:linear-gradient(135deg,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.price-label{font-family:'Inter',sans-serif;font-size:24px;color:#55556a;text-transform:uppercase;letter-spacing:4px;font-weight:600}
.features{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;z-index:1;max-width:1000px;margin:0 40px}
.features span{font-size:24px;color:#8888a0;letter-spacing:0.5px;padding:12px 28px;border-radius:100px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}
.footer-brand{font-size:22px;letter-spacing:6px;text-transform:uppercase;background:linear-gradient(135deg,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;z-index:1;align-self:center}
.circle1{position:absolute;width:400px;height:400px;border-radius:50%;border:1px solid rgba(124,58,237,0.06);bottom:-80px;right:-80px;pointer-events:none}
.circle2{position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(59,130,246,0.06);top:-60px;left:-60px;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div style="flex:0 0 auto;padding:48px 0 0;z-index:1;display:flex;justify-content:center">
    <div class="badge">VortexFlow Media</div>
  </div>
<div class="service-number">02</div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px;z-index:1;padding:30px 0">
    <div class="service-name">Thumbnail Design</div>
    <div class="service-desc">Bold thumbnails that stop the scroll and drive clicks.</div>
    <div class="price-box">
      <div class="price">₹149</div>
      <div class="price-label">Onwards</div>
    </div>
    <div class="features"><span>YouTube Thumbnails</span><span>Instagram Thumbnails</span></div>
  </div>
  <div style="flex:0 0 auto;padding:0 0 48px;z-index:1;display:flex;justify-content:center">
    <div class="footer-brand">VortexFlow Media</div>
  </div>
  <div class="circle1"></div>
  <div class="circle2"></div>
</div>
</body>
</html>
