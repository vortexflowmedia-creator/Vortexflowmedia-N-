<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Card - Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070d;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif}
.card{width:1440px;height:1440px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(145deg,#0b0b14,#0f0f1a);border:1px solid rgba(255,255,255,0.06);padding:80px}
.card::before{content:'';position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,0.12),transparent 70%);top:-25%;right:-15%;pointer-events:none}
.card::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.08),transparent 70%);bottom:-20%;left:-15%;pointer-events:none}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.06),transparent 70%);top:40%;right:10%;pointer-events:none}
.welcome-label{font-size:36px;letter-spacing:10px;text-transform:uppercase;color:#8888a0;font-weight:500;margin-bottom:20px;z-index:1}
.brand-name{font-family:'Playfair Display',serif;font-size:200px;font-weight:700;background:linear-gradient(135deg,#7c3aed,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:0.95;text-align:center;letter-spacing:-4px;z-index:1}
.tagline{font-size:32px;color:#55556a;text-align:center;max-width:900px;margin-top:32px;z-index:1;line-height:1.5;letter-spacing:0.5px}
.swipe{display:flex;align-items:center;gap:16px;margin-top:80px;z-index:1;font-size:26px;letter-spacing:6px;text-transform:uppercase;color:#3b82f6;font-weight:600;animation:fadeInOut 2s ease-in-out infinite}
@keyframes fadeInOut{0%,100%{opacity:0.4}50%{opacity:1}}
.swipe-arrow{font-size:42px;display:inline-block;animation:slideRight 1.5s ease-in-out infinite}
@keyframes slideRight{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.line{width:200px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);margin-top:48px;z-index:1}
.circle1{position:absolute;width:400px;height:400px;border-radius:50%;border:1px solid rgba(124,58,237,0.06);bottom:-80px;right:-80px;pointer-events:none}
.circle2{position:absolute;width:280px;height:280px;border-radius:50%;border:1px solid rgba(59,130,246,0.06);top:-60px;left:-60px;pointer-events:none}
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="welcome-label">Welcome to</div>
  <div class="brand-name">VortexFlow<br>Media</div>
  <div class="tagline">Premium creative solutions for brands,<br>creators &amp; businesses</div>
  <div class="line"></div>
  <div class="swipe">
    <span>Swipe to see services</span>
    <span class="swipe-arrow">→</span>
  </div>
  <div class="circle1"></div>
  <div class="circle2"></div>
</div>
</body>
</html>
